[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-sdk"
version = "0.1.0"
description = "Lightweight Confluence and Jira REST client SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
    "httpx>=0.24,<1.0",
    "pydantic>=1.10,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3"
]

[project.urls]
Homepage = "https://github.com/your-name/confluence-sdk"
Repository = "https://github.com/your-name/confluence-sdk.git"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
